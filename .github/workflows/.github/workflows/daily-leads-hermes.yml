─ yaml
      name: Daily PM/PO Leads (Hermes webhook) [DISABLED]
      on:
        workflow_dispatch: {}
      jobs:
        trigger-hermes:
          runs-on: ubuntu-latest
          steps:
            - name: POST to Hermes webhook
              env:
                HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
                HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
              run: |
                if [ -z "$HERMES_WEBHOOK_URL" ]; then
                  echo "::error::HERMES_WEBHOOK_URL secret not set."
                  exit 1
                fi
                SIG=$(printf '' | openssl dgst -sha256 -hmac "$HERMES_WEBHOOK_SECRET" -hex | awk '{print $2}')
                curl -fsS -X POST "$HERMES_WEBHOOK_URL" -H "Content-Type: application/json" -H "X-Hub-Signature-256: sha256=$SIG" -d
      '{"source":"github-actions","trigger":"daily-pmpo-leads","date":"'$(date -u +%Y-%m-%d)'"}' && echo "hermes webhook fired" ||
      (echo "::error::Hermes webhook failed"; exit 1)
